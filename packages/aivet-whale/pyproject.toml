[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aivet-whale"
version = "0.1.0"
description = "Sperm whale communication primitive for Doolittle-OSS — phonetic alphabet, vowel modulation, prosody, welfare assessment"
readme = "README.md"
license = "MIT"
authors = [{ name = "VetSorcery / Doolittle Collective", email = "dev@vetsorcery.com" }]
requires-python = ">=3.10"
keywords = ["whale", "cetacean", "bioacoustics", "project-ceti", "doolittle", "animal-communication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
audio = ["librosa>=0.10", "soundfile>=0.12"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["aivet-whale[audio,dev]"]

[project.urls]
Homepage = "https://github.com/midnightnow/doolittle-oss"
Documentation = "https://github.com/midnightnow/doolittle-oss/tree/main/packages/aivet-whale"
Repository = "https://github.com/midnightnow/doolittle-oss"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
