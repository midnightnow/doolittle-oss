
[tool.poetry]
name = "doolittle-core"
version = "0.1.0"
description = "Core schemas for Doolittle"
authors = ["Doolittle OSS <oss@doolittle.dev>"]

[tool.poetry.dependencies]
python = "^3.9"
pydantic = "^2.0.0"
vetsorcery-sdk = { git = "https://github.com/midnightnow/aivet-sdk.git", subdirectory = "packages/python", tag = "v1.1.1" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

